# site_name は develop プレビューのビルドだけ SITE_NAME で差し替え、
# どちらのサイトを開いているかをヘッダで判別できるようにする
site_name: !ENV [SITE_NAME, "学習教材集"]
site_description: データエンジニアの視点で書いた学習教材集。本文、演習問題、読み上げ音声を教材ごとにまとめる
site_url: !ENV [SITE_URL, "https://denzow.github.io/learning-docs/"]
repo_url: https://github.com/denzow/learning-docs
repo_name: denzow/learning-docs

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    # 教材ごとにタブを分け、サイドバーにはその教材の章だけを章単位の入れ子で並べる。
    # navigation.indexes により、教材の見出しは docs/<教材>/index.md へのリンクになる
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - footnotes
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  # mermaid フェンスをコードブロックではなく <pre class="mermaid"> として出力し、
  # Material 同梱の mermaid.js に図としてレンダリングさせる
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - css/quiz.css
  - css/audio-progress.css
  - css/audio-highlight.css

extra_javascript:
  - js/quiz.js
  - js/audio-progress.js
  # audio-progress.js が入れる案内やプレイヤーの高さを前提にするため、後に読み込む
  - js/audio-highlight.js

# 教材の追加とそのファイル構成は hooks/materials.py に集約する。nav には教材ごとに
# 「ラベル: ディレクトリ名/」の 1 行だけを書き、章ごとの入れ子（本文、演習問題、
# 読み上げ原稿）と章末の導線は hook が docs/<ディレクトリ>/ のファイルから組み立てる。
# hooks/redirects.py は extra.redirects の旧 URL に転送ページを置く
hooks:
  - hooks/materials.py
  - hooks/redirects.py

nav:
  - ホーム: index.md
  - データモデリング: data-modeling/

extra:

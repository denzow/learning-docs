# site_name は develop プレビューのビルドだけ SITE_NAME で差し替え、
# どちらのサイトを開いているかをヘッダで判別できるようにする
site_name: !ENV [SITE_NAME, "データモデリングの学習ドキュメント"]
site_description: データエンジニアの視点でデータモデリングを学ぶためのドキュメント群
site_url: !ENV [SITE_URL, "https://denzow.github.io/study-for-data-modeling/"]
repo_url: https://github.com/denzow/study-for-data-modeling
repo_name: denzow/study-for-data-modeling

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - footnotes
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - css/quiz.css

extra_javascript:
  - js/quiz.js

nav:
  - ホーム: index.md
  - 本文:
      - 第1章 データモデリングの全体像: 01-overview.md
      - 第2章 リレーショナルモデルの基礎: 02-relational-basics.md
      - 第3章 正規化: 03-normalization.md
      - 第4章 ディメンショナルモデリング: 04-dimensional-modeling.md
      - 第5章 Slowly Changing Dimensions: 05-slowly-changing-dimensions.md
      - 第6章 DWH アーキテクチャ: 06-dwh-architecture.md
      - 第7章 Data Vault: 07-data-vault.md
      - 第8章 ワイドテーブルと One Big Table: 08-one-big-table.md
      - 第9章 現代のデータスタックでのモデリング: 09-modern-data-stack.md
      - 第10章 NoSQL のデータモデリング: 10-nosql-modeling.md
      - 第11章 総合演習: 11-capstone.md
  - 演習問題:

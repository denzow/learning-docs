name: deploy-pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# GitHub Pages は 1 リポジトリ 1 サイトで、deploy-pages はサイト全体を
# 置き換える。片方のブランチだけをビルドすると他方が消えるため、
# どちらのブランチへの push でも main と develop の両方をビルドして
# 1 つのアーティファクトにまとめる。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r main/requirements.txt -r develop/requirements.txt
      - name: Build main (公開版)
        run: mkdocs build --strict --site-dir ../site
        working-directory: main
        env:
          SITE_URL: https://denzow.github.io/learning-docs/
      - name: Build develop (プレビュー)
        run: mkdocs build --strict --site-dir ../site/develop
        working-directory: develop
        env:
          SITE_URL: https://denzow.github.io/learning-docs/develop/
          SITE_NAME: 学習教材集（develop プレビュー）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

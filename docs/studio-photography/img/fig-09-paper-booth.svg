<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-label="背景紙のブース">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7a7a7a"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#333333"/></marker><marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#f2a900"/></marker><marker id="arrow-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b3541e"/></marker><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<rect x="0.5" y="0.5" width="779" height="419" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="16" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="24.0" dy="0">背景紙のブース</tspan></text>
<text x="24.0" y="50.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">横から見た図。紙は壁に沿って垂らし、床へ緩やかに延ばす</tspan></text>
<rect x="50" y="100.0" width="690" height="290.0" fill="#fbfaf7"/>
<rect x="76" y="110.0" width="14" height="254.0" fill="#e6e1d8" stroke="#333333" stroke-width="1"/>
<rect x="76" y="350" width="680" height="14" fill="#e6e1d8" stroke="#333333" stroke-width="1"/>
<rect x="90" y="130.0" width="30" height="6" fill="#555555"/>
<circle cx="120" cy="142.0" r="16" fill="#d9d4cc" stroke="#333333" stroke-width="1.2"/>
<circle cx="120" cy="142.0" r="4" fill="#555555"/>
<circle cx="120.0" cy="112.0" r="10" fill="#333333"/><text x="120.0" y="116.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="120.0" dy="0">1</tspan></text>
<path d="M134,142.0 L134,290 Q134,347 194,347 L254.0,347" fill="none" stroke="#8c8c8c" stroke-width="5" stroke-linecap="butt"/>
<circle cx="160.0" cy="214.0" r="10" fill="#333333"/><text x="160.0" y="218.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="160.0" dy="0">2</tspan></text>
<circle cx="162.0" cy="326.0" r="10" fill="#333333"/><text x="162.0" y="330.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="162.0" dy="0">3</tspan></text>
<rect x="242.0" y="342" width="16" height="7" fill="#8ec5a0" stroke="#333333" stroke-width="0.8"/>
<circle cx="250.0" cy="324.0" r="10" fill="#333333"/><text x="250.0" y="328.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="250.0" dy="0">4</tspan></text>
<circle cx="186.0" cy="347" r="5" fill="#6b5a3e" opacity="0.7"/>
<line x1="134.0" y1="330" x2="134.0" y2="360" stroke="#b3541e" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="134.0" cy="380.0" r="10" fill="#333333"/><text x="134.0" y="384.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="134.0" dy="0">5</tspan></text>
<rect x="236.0" y="282.0" width="28" height="68.0" fill="#5c6b80" stroke="#333333" stroke-width="1"/>
<path d="M228.0,238.0 C228.0,234.0 244.0,234.0 250.0,234.0 C256.0,234.0 272.0,234.0 272.0,238.0 L270.0,282.0 L230.0,282.0 Z" fill="#a9b8cf" stroke="#333333" stroke-width="1"/>
<circle cx="250.0" cy="226.0" r="8.8" fill="#f1d9c2" stroke="#333333" stroke-width="1"/>
<path d="M241.2,224.39999999999998 A8.8,8.8 0 0,1 258.8,224.39999999999998 Z" fill="#3b2f2a"/>
<circle cx="284.0" cy="214.0" r="10" fill="#333333"/><text x="284.0" y="218.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="284.0" dy="0">6</tspan></text>
<path d="M428.0,350 L442.0,264.0 L456.0,350 M442.0,264.0 L442.0,350" fill="none" stroke="#555555" stroke-width="1.5"/>
<rect x="430.0" y="244.0" width="24" height="20" rx="3" fill="#3c3c3c"/>
<rect x="416.0" y="248.0" width="14" height="12" fill="#666" stroke="#333333" stroke-width="1"/>
<line x1="134" y1="394" x2="250.0" y2="394" stroke="#b3541e" stroke-width="1" stroke-dasharray="5 3"/><line x1="134" y1="389" x2="134" y2="399" stroke="#b3541e" stroke-width="1.2"/><line x1="250.0" y1="389" x2="250.0" y2="399" stroke="#b3541e" stroke-width="1.2"/><text x="192.0" y="410.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#b3541e" font-weight="normal"><tspan x="192.0" dy="0">床に 1.5m ほど伸ばす</tspan></text>
<line x1="114" y1="142.0" x2="114" y2="347" stroke="#b3541e" stroke-width="1" stroke-dasharray="5 3"/>
<text x="108.0" y="246.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="end" fill="#b3541e" font-weight="normal"><tspan x="108.0" dy="0">幅 2.72m の紙</tspan></text>
<circle cx="470.0" cy="80.0" r="8" fill="#333333"/><text x="470.0" y="84.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="470.0" dy="0">1</tspan></text>
<text x="484.0" y="84.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="484.0" dy="0">ロール。上から引き出す</tspan></text>
<circle cx="470.0" cy="100.0" r="8" fill="#333333"/><text x="470.0" y="104.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="470.0" dy="0">2</tspan></text>
<text x="484.0" y="104.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="484.0" dy="0">壁に沿って床まで垂らす</tspan></text>
<circle cx="470.0" cy="120.0" r="8" fill="#333333"/><text x="470.0" y="124.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="470.0" dy="0">3</tspan></text>
<text x="484.0" y="124.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="484.0" dy="0">床へは緩い曲線でつなぐ（境目が写らない）</tspan></text>
<circle cx="470.0" cy="140.0" r="8" fill="#333333"/><text x="470.0" y="144.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="470.0" dy="0">4</tspan></text>
<text x="484.0" y="144.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="484.0" dy="0">先端は養生テープで床に留める</tspan></text>
<circle cx="470.0" cy="160.0" r="8" fill="#333333"/><text x="470.0" y="164.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="470.0" dy="0">5</tspan></text>
<text x="484.0" y="164.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="484.0" dy="0">汚れた部分は最小限を切り落とす</tspan></text>
<circle cx="470.0" cy="180.0" r="8" fill="#333333"/><text x="470.0" y="184.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="470.0" dy="0">6</tspan></text>
<text x="484.0" y="184.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="484.0" dy="0">被写体は紙の上に立つ。靴の裏を拭く</tspan></text>
<text x="470.0" y="216.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="470.0" dy="0">撤収時は床の部分を持ち上げてから巻き上げる。</tspan></text>
<text x="470.0" y="232.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="470.0" dy="0">伸ばしたまま巻くと、床との角で紙が折れる。</tspan></text>
</svg>

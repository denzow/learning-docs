<text x="246.0" y="282.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#7a7a7a" font-weight="normal"><tspan x="246.0" dy="0">面積 1 倍</tspan></text>
<text x="246.0" y="298.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#b3541e" font-weight="normal"><tspan x="246.0" dy="0">±0 段　f/8</tspan></text>
<path d="M300.0,188.98 L310.85699999999997,181.225 L310.85699999999997,243.26500000000001 L300.0,251.02 Z" fill="#f2a900" stroke="#333333" stroke-width="1" opacity="0.32" />

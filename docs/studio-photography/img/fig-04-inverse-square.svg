<text x="396.0" y="304.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#7a7a7a" font-weight="normal"><tspan x="396.0" dy="0">面積 4 倍</tspan></text>
<text x="396.0" y="320.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#b3541e" font-weight="normal"><tspan x="396.0" dy="0">-2 段　f/4</tspan></text>

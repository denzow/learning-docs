<text x="306.0" y="291.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#7a7a7a" font-weight="normal"><tspan x="306.0" dy="0">面積 2 倍</tspan></text>
<text x="306.0" y="307.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#b3541e" font-weight="normal"><tspan x="306.0" dy="0">-1 段　f/5.6</tspan></text>

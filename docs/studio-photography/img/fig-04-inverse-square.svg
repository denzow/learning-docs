<text x="24.0" y="52.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">光源からの距離が √2 倍になるごとに、光が広がる面積は 2 倍になり、明るさは 1 段ずつ下がる</tspan></text>

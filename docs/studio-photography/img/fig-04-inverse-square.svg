<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="逆二乗則：距離が伸びるほど同じ光が広い面に薄まる">
<defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<rect x="0.5" y="0.5" width="799" height="399" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="16" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="24.0" dy="0">逆二乗則：距離が伸びるほど同じ光が広い面に薄まる</tspan></text>
<text x="24.0" y="52.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">光源からの距離が √2 倍になるごとに、光が広がる面積は 2 倍になり、明るさは 1 段ずつ下がる</tspan></text>
<rect x="66.0" y="190.0" width="24.0" height="60.0" rx="0" fill="#f7f7f7" stroke="#333333" stroke-width="1.3"/>

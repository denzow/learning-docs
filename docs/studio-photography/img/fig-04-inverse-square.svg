<text x="24.0" y="372.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">出力 1/4 のソフトボックスなら、1.5m で f/8、2.1m で f/5.6、3m で f/4。位置を決めたら明るさは出力で合わせる</tspan></text>
</svg>

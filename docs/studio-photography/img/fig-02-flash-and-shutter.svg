<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="シャッターが開いている時間と閃光時間、定常光の関係" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#333333"/></marker>
</defs>
<rect x="0.5" y="0.5" width="759" height="429" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="30" font-size="16" font-weight="bold" fill="#333333">シャッター速度はストロボ光に効かず、定常光にだけ効く</text>
<text x="24" y="50" font-size="11" fill="#7a7a7a">横軸は時間。色の付いた面積がセンサーに届く光の量</text>

<!-- 凡例 -->
<g transform="translate(520,40)">
  <rect x="0" y="0" width="14" height="10" fill="#f2a900"/><text x="20" y="9" font-size="11" fill="#333333">ストロボ光（閃光 1/1000 秒前後）</text>
  <rect x="0" y="16" width="14" height="10" fill="#a9b8cf"/><text x="20" y="25" font-size="11" fill="#333333">定常光（モデリングランプや部屋の照明）</text>
</g>

<!-- 上段: 1/200 秒 -->
<g transform="translate(0,80)">
  <text x="24" y="20" font-size="13" font-weight="bold" fill="#333333">シャッター速度 1/200 秒（5ms）</text>
  <!-- 軸 -->
  <line x1="100" y1="130" x2="720" y2="130" stroke="#333333" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="100" y1="130" x2="100" y2="40" stroke="#333333" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="96" y="46" font-size="11" fill="#7a7a7a" text-anchor="end">光の強さ</text>
  <text x="720" y="146" font-size="11" fill="#7a7a7a" text-anchor="end">時間</text>
  <!-- 目盛り -->
  <g font-size="10" fill="#7a7a7a" text-anchor="middle">
    <text x="100" y="144">0</text><text x="220" y="144">5ms</text><text x="340" y="144">10ms</text>
  </g>
  <!-- シャッターの開いている帯 -->
  <rect x="100" y="60" width="120" height="70" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="160" y="56" font-size="11" fill="#333333" text-anchor="middle">シャッターが開いている</text>
  <!-- 定常光 -->
  <rect x="100" y="118" width="120" height="12" fill="#a9b8cf"/>
  <!-- 閃光 -->
  <path d="M112,130 L116,70 L120,64 L124,70 L136,130 Z" fill="#f2a900"/>
  <text x="250" y="90" font-size="11" fill="#333333">閃光は 1ms ほどで出きる。</text>
  <text x="250" y="106" font-size="11" fill="#333333">帯の残りの時間には、ストロボの光はない</text>
</g>

<!-- 下段: 1/100 秒 -->
<g transform="translate(0,250)">
  <text x="24" y="20" font-size="13" font-weight="bold" fill="#333333">シャッター速度 1/100 秒（10ms）に遅くすると</text>
  <line x1="100" y1="130" x2="720" y2="130" stroke="#333333" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="100" y1="130" x2="100" y2="40" stroke="#333333" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="96" y="46" font-size="11" fill="#7a7a7a" text-anchor="end">光の強さ</text>
  <text x="720" y="146" font-size="11" fill="#7a7a7a" text-anchor="end">時間</text>
  <g font-size="10" fill="#7a7a7a" text-anchor="middle">
    <text x="100" y="144">0</text><text x="220" y="144">5ms</text><text x="340" y="144">10ms</text>
  </g>
  <rect x="100" y="60" width="240" height="70" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="220" y="56" font-size="11" fill="#333333" text-anchor="middle">シャッターが開いている（2 倍の時間）</text>
  <rect x="100" y="118" width="240" height="12" fill="#a9b8cf"/>
  <path d="M112,130 L116,70 L120,64 L124,70 L136,130 Z" fill="#f2a900"/>
  <text x="370" y="84" font-size="11" fill="#333333">ストロボ光の面積は同じ → 肌の明るさは変わらない</text>
  <text x="370" y="102" font-size="11" fill="#333333">定常光の面積は 2 倍 → 部屋の光だけが 1 段明るく写る</text>
  <text x="370" y="120" font-size="11" fill="#7a7a7a">ISO 100、f/8 では定常光の帯はほぼゼロで、真っ黒に写る</text>
</g>
</svg>

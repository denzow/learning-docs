<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-label="シャッター速度は定常光の分だけを変える">
<defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<rect x="0.5" y="0.5" width="779" height="399" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="16" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="24.0" dy="0">シャッター速度は定常光の分だけを変える</tspan></text>
<text x="24.0" y="52.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">ストロボ光を 100 としたときの、センサーに届く光の量</tspan></text>
<rect x="24.0" y="62.0" width="12.0" height="12.0" rx="0" fill="#f2a900" stroke="#333333" stroke-width="0.8"/>
<text x="40.0" y="72.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="40.0" dy="0">ストロボ光（閃光）</tspan></text>
<rect x="150.0" y="62.0" width="12.0" height="12.0" rx="0" fill="#9dc183" stroke="#333333" stroke-width="0.8"/>
<text x="166.0" y="72.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="166.0" dy="0">定常光（蛍光灯や窓）</tspan></text>
<rect x="300.0" y="62.0" width="24.0" height="10.0" rx="0" fill="#d7e3c9" stroke="#333333" stroke-width="0.8"/>
<rect x="304.0" y="59.0" width="3.0" height="16.0" rx="0" fill="#f2a900" stroke="none" stroke-width="0"/>
<text x="330.0" y="72.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="330.0" dy="0">シャッターが開いている時間と閃光の位置</tspan></text>
<line x1="70.0" y1="312.0" x2="680.0" y2="312.0" stroke="#333333" stroke-width="1"/>
<line x1="70.0" y1="312.0" x2="70.0" y2="150.0" stroke="#333333" stroke-width="1"/>
<line x1="66.0" y1="252.0" x2="70.0" y2="252.0" stroke="#333333" stroke-width="1"/>
<text x="62.0" y="256.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="end" fill="#7a7a7a" font-weight="normal"><tspan x="62.0" dy="0">100</tspan></text>
<line x1="66.0" y1="192.0" x2="70.0" y2="192.0" stroke="#333333" stroke-width="1"/>
<text x="62.0" y="196.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="end" fill="#7a7a7a" font-weight="normal"><tspan x="62.0" dy="0">200</tspan></text>
<text x="70.0" y="142.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="middle" fill="#7a7a7a" font-weight="normal"><tspan x="70.0" dy="0">光の量</tspan></text>
<text x="110.0" y="100.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="110.0" dy="0">1/200 秒</tspan></text>
<rect x="110.0" y="108.0" width="24.0" height="10.0" rx="0" fill="#d7e3c9" stroke="#333333" stroke-width="0.8"/>
<rect x="114.0" y="104.0" width="3.0" height="18.0" rx="0" fill="#f2a900" stroke="none" stroke-width="0"/>
<rect x="110.0" y="252.0" width="54.0" height="60.0" rx="0" fill="#f2a900" stroke="#333333" stroke-width="0.8"/>
<rect x="110.0" y="244.8" width="54.0" height="7.2" rx="0" fill="#9dc183" stroke="#333333" stroke-width="0.8"/>
<text x="172.0" y="286.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="172.0" dy="0">ストロボ光 100</tspan></text>
<text x="172.0" y="252.4" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#3f6b2a" font-weight="normal"><tspan x="172.0" dy="0">定常光 12</tspan></text>
<text x="110.0" y="334.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="110.0" dy="0">3 段下。影の側にわずかな色かぶり</tspan></text>
<text x="300.0" y="100.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="300.0" dy="0">1/60 秒</tspan></text>
<rect x="300.0" y="108.0" width="72.0" height="10.0" rx="0" fill="#d7e3c9" stroke="#333333" stroke-width="0.8"/>
<rect x="304.0" y="104.0" width="3.0" height="18.0" rx="0" fill="#f2a900" stroke="none" stroke-width="0"/>
<rect x="300.0" y="252.0" width="54.0" height="60.0" rx="0" fill="#f2a900" stroke="#333333" stroke-width="0.8"/>
<rect x="300.0" y="228.0" width="54.0" height="24.0" rx="0" fill="#9dc183" stroke="#333333" stroke-width="0.8"/>
<text x="362.0" y="286.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="362.0" dy="0">ストロボ光 100</tspan></text>
<text x="362.0" y="244.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#3f6b2a" font-weight="normal"><tspan x="362.0" dy="0">定常光 40</tspan></text>
<text x="300.0" y="334.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="300.0" dy="0">1.7 段増えて混ざりが見える</tspan></text>
<text x="490.0" y="100.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="490.0" dy="0">1/15 秒</tspan></text>
<rect x="490.0" y="108.0" width="120.0" height="10.0" rx="0" fill="#d7e3c9" stroke="#333333" stroke-width="0.8"/>
<rect x="494.0" y="104.0" width="3.0" height="18.0" rx="0" fill="#f2a900" stroke="none" stroke-width="0"/>
<rect x="490.0" y="252.0" width="54.0" height="60.0" rx="0" fill="#f2a900" stroke="#333333" stroke-width="0.8"/>
<rect x="490.0" y="156.0" width="54.0" height="96.0" rx="0" fill="#9dc183" stroke="#333333" stroke-width="0.8"/>
<text x="552.0" y="286.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="552.0" dy="0">ストロボ光 100</tspan></text>
<text x="552.0" y="208.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#3f6b2a" font-weight="normal"><tspan x="552.0" dy="0">定常光 160</tspan></text>
<text x="490.0" y="334.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="490.0" dy="0">定常光が主役になり、ブレも出る</tspan></text>
<text x="70.0" y="364.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="70.0" dy="0">ストロボの閃光は 1/1000 秒前後で終わるので、シャッターを長く開けても増えるのは定常光だけである。</tspan></text>
<text x="70.0" y="382.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="70.0" dy="0">確認は「ストロボを切って同じ設定で撮る」。真っ黒なら定常光は写っていない。</tspan></text>
</svg>

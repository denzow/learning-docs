<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="シャッター方式の違いと同調速度" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6db5"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#7a7a7a" stroke-width="1"/></pattern>
</defs>
<rect x="0.5" y="0.5" width="759" height="559" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="30" font-size="16" font-weight="bold" fill="#333333">シャッター方式と同調速度</text>
<text x="24" y="50" font-size="11" fill="#7a7a7a">四角はセンサー。ストロボは一瞬しか光らないので、その瞬間にセンサー全体が開いている必要がある</text>

<!-- 上段: 三つの方式 -->
<g transform="translate(40,70)">
  <text x="0" y="14" font-size="13" font-weight="bold" fill="#333333">三つのシャッター方式（露光の始まりと終わりを何が担うか）</text>
  <!-- メカ -->
  <g transform="translate(0,30)">
    <rect x="0" y="0" width="150" height="100" fill="#fff4cf" stroke="#333333" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="26" fill="#555555"/>
    <rect x="0" y="80" width="150" height="20" fill="#555555"/>
    <text x="75" y="18" font-size="10" fill="#ffffff" text-anchor="middle">先幕（メカ）</text>
    <text x="75" y="94" font-size="10" fill="#ffffff" text-anchor="middle">後幕（メカ）</text>
    <line x1="75" y1="30" x2="75" y2="74" stroke="#2f6db5" stroke-width="1.2" marker-end="url(#ar)"/>
    <text x="75" y="120" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">メカシャッター</text>
    <text x="75" y="136" font-size="11" fill="#333333" text-anchor="middle">ストロボ可</text>
    <text x="75" y="151" font-size="11" fill="#7a7a7a" text-anchor="middle">同調速度 1/250 秒</text>
  </g>
  <!-- 電子先幕 -->
  <g transform="translate(200,30)">
    <rect x="0" y="0" width="150" height="100" fill="#fff4cf" stroke="#333333" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="26" fill="url(#hatch)" stroke="#7a7a7a" stroke-width="0.8"/>
    <rect x="0" y="80" width="150" height="20" fill="#555555"/>
    <text x="75" y="18" font-size="10" fill="#333333" text-anchor="middle">先幕（電子的なリセット）</text>
    <text x="75" y="94" font-size="10" fill="#ffffff" text-anchor="middle">後幕（メカ）</text>
    <line x1="75" y1="30" x2="75" y2="74" stroke="#2f6db5" stroke-width="1.2" marker-end="url(#ar)"/>
    <text x="75" y="120" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">電子先幕</text>
    <text x="75" y="136" font-size="11" fill="#333333" text-anchor="middle">ストロボ可</text>
    <text x="75" y="151" font-size="11" fill="#7a7a7a" text-anchor="middle">同調速度 1/250 秒</text>
  </g>
  <!-- 電子 -->
  <g transform="translate(400,30)">
    <rect x="0" y="0" width="150" height="100" fill="#f3f3f3" stroke="#333333" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="14" fill="url(#hatch)" stroke="#7a7a7a" stroke-width="0.8"/>
    <rect x="0" y="34" width="150" height="14" fill="#fff4cf" stroke="#7a7a7a" stroke-width="0.8"/>
    <rect x="0" y="0" width="150" height="34" fill="none" stroke="none"/>
    <text x="75" y="28" font-size="10" fill="#333333" text-anchor="middle">読み出しが上から下へ順に進む</text>
    <text x="75" y="70" font-size="10" fill="#7a7a7a" text-anchor="middle">全体が同時に開く瞬間がない</text>
    <line x1="75" y1="78" x2="75" y2="94" stroke="#2f6db5" stroke-width="1.2" marker-end="url(#ar)"/>
    <text x="75" y="120" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">電子シャッター</text>
    <text x="75" y="136" font-size="11" fill="#b3541e" font-weight="bold" text-anchor="middle">ストロボ不可</text>
    <text x="75" y="151" font-size="11" fill="#7a7a7a" text-anchor="middle">発光しない</text>
  </g>
  <text x="580" y="60" font-size="11" fill="#7a7a7a">薄い黄色：</text>
  <text x="580" y="75" font-size="11" fill="#7a7a7a">露光している面</text>
  <text x="580" y="100" font-size="11" fill="#7a7a7a">濃い灰色：</text>
  <text x="580" y="115" font-size="11" fill="#7a7a7a">幕が覆っている面</text>
</g>

<!-- 下段: 同調速度 -->
<g transform="translate(40,270)">
  <text x="0" y="14" font-size="13" font-weight="bold" fill="#333333">同調速度より速いと黒い帯が出る（メカシャッターの例）</text>
  <!-- 1/200 -->
  <g transform="translate(0,30)">
    <text x="75" y="14" font-size="12" fill="#333333" text-anchor="middle">1/200 秒</text>
    <rect x="0" y="24" width="150" height="100" fill="#fff4cf" stroke="#333333" stroke-width="1.2"/>
    <rect x="0" y="24" width="150" height="6" fill="#555555"/>
    <rect x="0" y="118" width="150" height="6" fill="#555555"/>
    <text x="75" y="78" font-size="11" fill="#333333" text-anchor="middle">先幕が開ききり、</text>
    <text x="75" y="93" font-size="11" fill="#333333" text-anchor="middle">後幕はまだ閉じ始めない</text>
    <text x="75" y="146" font-size="11" fill="#333333" text-anchor="middle">この瞬間にストロボが光る</text>
    <text x="75" y="162" font-size="11" fill="#2f6db5" text-anchor="middle">→ 全面が写る</text>
  </g>
  <!-- 1/500 -->
  <g transform="translate(200,30)">
    <text x="75" y="14" font-size="12" font-weight="bold" fill="#333333" text-anchor="middle">1/500 秒</text>
    <rect x="0" y="24" width="150" height="100" fill="#fff4cf" stroke="#333333" stroke-width="1.2"/>
    <rect x="0" y="24" width="150" height="40" fill="#555555"/>
    <rect x="0" y="94" width="150" height="30" fill="#555555"/>
    <text x="75" y="48" font-size="10" fill="#ffffff" text-anchor="middle">後幕がもう閉じ始めている</text>
    <text x="75" y="83" font-size="10" fill="#333333" text-anchor="middle">スリットの部分だけ露光</text>
    <text x="75" y="113" font-size="10" fill="#ffffff" text-anchor="middle">先幕がまだ開ききらない</text>
    <text x="75" y="146" font-size="11" fill="#333333" text-anchor="middle">この瞬間にストロボが光る</text>
    <text x="75" y="162" font-size="11" fill="#b3541e" text-anchor="middle">→ スリットだけ写る</text>
  </g>
  <!-- 結果 -->
  <g transform="translate(420,30)">
    <text x="75" y="14" font-size="12" fill="#333333" text-anchor="middle">写真（1/500 秒）</text>
    <rect x="0" y="24" width="150" height="100" fill="#222222" stroke="#333333" stroke-width="1.2"/>
    <rect x="0" y="64" width="150" height="30" fill="#f1d9c2"/>
    <text x="75" y="46" font-size="10" fill="#ffffff" text-anchor="middle">黒い帯</text>
    <text x="75" y="112" font-size="10" fill="#ffffff" text-anchor="middle">黒い帯</text>
    <text x="75" y="83" font-size="10" fill="#333333" text-anchor="middle">被写体が写る部分</text>
    <text x="75" y="146" font-size="11" fill="#333333" text-anchor="middle">同調速度 1/250 秒でも、</text>
    <text x="75" y="162" font-size="11" fill="#333333" text-anchor="middle">無線の遅れで端に細い帯が出うる</text>
  </g>
  <text x="600" y="90" font-size="11" fill="#333333">教材の基準は</text>
  <text x="600" y="106" font-size="13" font-weight="bold" fill="#2f6db5">1/200 秒</text>
  <text x="600" y="124" font-size="11" fill="#7a7a7a">同調速度に対する余裕</text>
</g>
</svg>

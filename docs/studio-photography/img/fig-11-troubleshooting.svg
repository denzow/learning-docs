<text x="586.0" y="101.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="586.0" dy="0">被写体の光</tspan></text>
<line x1="640.0" y1="97.0" x2="650.0" y2="97.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="650.0" y="84.0" width="108.0" height="26.0" rx="4" fill="#f4f4f4" stroke="#333333" stroke-width="1" />
<text x="704.0" y="101.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="704.0" dy="0">センサー</tspan></text>
<text x="60.0" y="128.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="60.0" dy="0">光が写るまでの経路（上）。下の流れは、この経路を確かめやすい順にたどる</tspan></text>
<rect x="60.0" y="162.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4" />
<text x="210.0" y="184.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="210.0" dy="0">トリガーのテストボタンで</tspan><tspan x="210.0" dy="16.2">3 灯すべてが光るか</tspan></text>
<text x="60.0" y="156.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#2f6db5" font-weight="bold"><tspan x="60.0" dy="0">症状：発光しない</tspan></text>
<line x1="360.0" y1="188.0" x2="430.0" y2="188.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="395.0" y="182.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="395.0" dy="0">光らない</tspan></text>
<rect x="430.0" y="158.5" width="310.0" height="59.0" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1" />

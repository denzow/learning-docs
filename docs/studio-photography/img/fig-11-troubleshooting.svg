<line x1="320.0" y1="214.0" x2="320.0" y2="244.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="326.0" y="227.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="326.0" dy="0">問題なし</tspan></text>
<rect x="60.0" y="246.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4" />
<text x="210.0" y="276.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="210.0" dy="0">写真の一部が黒い帯になるか</tspan></text>
<text x="60.0" y="240.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#2f6db5" font-weight="bold"><tspan x="60.0" dy="0">症状：黒い帯</tspan></text>
<line x1="360.0" y1="272.0" x2="430.0" y2="272.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="395.0" y="266.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="395.0" dy="0">なる</tspan></text>
<rect x="430.0" y="250.0" width="310.0" height="44.0" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1" />
<text x="440.0" y="268.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="440.0" dy="0">シャッター速度が 1/250 秒を超えている</tspan><tspan x="440.0" dy="14.3">1/200 秒に戻す。HSS を切る</tspan></text>
<line x1="320.0" y1="298.0" x2="320.0" y2="328.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="326.0" y="311.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="326.0" dy="0">問題なし</tspan></text>
<rect x="60.0" y="330.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4" />
<text x="210.0" y="360.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="210.0" dy="0">暗いコマが規則的に混ざるか</tspan></text>
<text x="60.0" y="324.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#2f6db5" font-weight="bold"><tspan x="60.0" dy="0">症状：暗いコマ</tspan></text>
<line x1="360.0" y1="356.0" x2="430.0" y2="356.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="395.0" y="350.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="395.0" dy="0">混ざる</tspan></text>
<rect x="430.0" y="334.0" width="310.0" height="44.0" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1" />
<text x="440.0" y="352.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="440.0" dy="0">チャージが追いついていない</tspan><tspan x="440.0" dy="14.3">レディ音を待つ。出力を下げて ISO を上げる</tspan></text>
<line x1="320.0" y1="382.0" x2="320.0" y2="412.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="326.0" y="395.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="326.0" dy="0">問題なし</tspan></text>
<rect x="60.0" y="414.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4" />
<text x="210.0" y="444.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="210.0" dy="0">色が想定と違うか</tspan></text>
<text x="60.0" y="408.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#2f6db5" font-weight="bold"><tspan x="60.0" dy="0">症状：色が合わない</tspan></text>
<line x1="360.0" y1="440.0" x2="430.0" y2="440.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="395.0" y="434.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="395.0" dy="0">違う</tspan></text>
<rect x="430.0" y="410.5" width="310.0" height="59.0" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1" />
<text x="440.0" y="428.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="440.0" dy="0">WB を 5500K に戻す</tspan><tspan x="440.0" dy="14.3">ストロボを切って撮り、真っ黒でなければ</tspan><tspan x="440.0" dy="14.3">環境光かモデリングランプの混入</tspan></text>
<line x1="320.0" y1="466.0" x2="320.0" y2="496.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="326.0" y="479.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="326.0" dy="0">問題なし</tspan></text>
<rect x="60.0" y="498.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4" />
<text x="210.0" y="520.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="210.0" dy="0">ファインダーや背面モニターが</tspan><tspan x="210.0" dy="16.2">暗いか</tspan></text>
<text x="60.0" y="492.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#2f6db5" font-weight="bold"><tspan x="60.0" dy="0">症状：ファインダーが暗い</tspan></text>
<line x1="360.0" y1="524.0" x2="430.0" y2="524.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="395.0" y="518.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="395.0" dy="0">暗い</tspan></text>
<rect x="430.0" y="509.5" width="310.0" height="29.0" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1" />
<text x="440.0" y="527.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="440.0" dy="0">露出Simulation を「しない」に戻す</tspan></text>
<line x1="320.0" y1="550.0" x2="320.0" y2="580.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="326.0" y="563.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="326.0" dy="0">問題なし</tspan></text>
<rect x="60.0" y="582.0" width="300.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4" />
<text x="210.0" y="612.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="210.0" dy="0">ピントが甘いか</tspan></text>
<text x="60.0" y="576.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#2f6db5" font-weight="bold"><tspan x="60.0" dy="0">症状：ピント</tspan></text>
<line x1="360.0" y1="608.0" x2="430.0" y2="608.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="395.0" y="602.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="395.0" dy="0">甘い</tspan></text>
<rect x="430.0" y="586.0" width="310.0" height="44.0" rx="6" fill="#fff8e1" stroke="#333333" stroke-width="1" />
<text x="440.0" y="604.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="440.0" dy="0">拡大表示で確認。瞳検出が働いているか</tspan><tspan x="440.0" dy="14.3">モデリングランプを最大に。f/8 まで絞る</tspan></text>
<text x="60.0" y="658.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="60.0" dy="0">ここまでで見つからなければ、被写体の位置と用具の向きを最初の配置図と見比べる</tspan></text>
</svg>

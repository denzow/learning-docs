<line x1="404.0" y1="97.0" x2="414.0" y2="97.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="414.0" y="84.0" width="108.0" height="26.0" rx="4" fill="#f4f4f4" stroke="#333333" stroke-width="1" />

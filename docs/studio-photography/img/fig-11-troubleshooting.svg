<rect x="0.5" y="0.5" width="779" height="699" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="16" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="24.0" dy="0">トラブルは光の経路の順に切り分ける</tspan></text>
<text x="24.0" y="52.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">症状から原因を当てにいくより、トリガー、ストロボ、カメラの順に確かめるほうが早い</tspan></text>
<rect x="60.0" y="84.0" width="108.0" height="26.0" rx="4" fill="#f4f4f4" stroke="#333333" stroke-width="1" />

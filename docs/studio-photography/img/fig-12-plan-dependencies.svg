<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" role="img" aria-label="撮影計画の依存の向き">
<defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#333333"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6db5"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="559" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="16" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="24.0" dy="0">撮影計画の依存の向き</tspan></text>
<text x="24.0" y="52.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">後の段階の判断は、前の段階の成果物の上に載る。矢印は依存の向き</tspan></text>
<rect x="270.0" y="84.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="270.0" y="84.0" width="112.0" height="50.0" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.4"/>
<text x="326.0" y="113.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="326.0" dy="0">要件の整理</tspan></text>
<text x="392.0" y="105.2" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="392.0" dy="0">何を、どの用途で、何カット、</tspan><tspan x="392.0" dy="13.7">どの形式で納めるか</tspan></text>
<text x="654.0" y="113.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="654.0" dy="0">第 1 章</tspan></text>
<line x1="326.0" y1="134.0" x2="326.0" y2="148.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow1)"/>
<rect x="270.0" y="150.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="270.0" y="150.0" width="112.0" height="50.0" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.4"/>
<text x="326.0" y="179.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="326.0" dy="0">露出の基準</tspan></text>
<text x="392.0" y="171.2" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="392.0" dy="0">用途と被写界深度から絞りを決め、</tspan><tspan x="392.0" dy="13.7">ISO とシャッター速度を固定する</tspan></text>
<text x="654.0" y="179.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="654.0" dy="0">第 2 章</tspan></text>
<line x1="326.0" y1="200.0" x2="326.0" y2="214.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow1)"/>
<rect x="270.0" y="216.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="270.0" y="216.0" width="112.0" height="50.0" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.4"/>
<text x="326.0" y="245.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="326.0" dy="0">カメラの設定</tspan></text>
<text x="392.0" y="237.2" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="392.0" dy="0">シャッター方式、AF か MF か、</tspan><tspan x="392.0" dy="13.7">レンズと焦点距離、テザーの有無</tspan></text>
<text x="654.0" y="245.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="654.0" dy="0">第 3 章</tspan></text>
<line x1="326.0" y1="266.0" x2="326.0" y2="280.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow1)"/>
<rect x="270.0" y="282.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="270.0" y="282.0" width="112.0" height="50.0" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.4"/>
<text x="326.0" y="311.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="326.0" dy="0">灯数と用具</tspan></text>
<text x="392.0" y="303.2" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="392.0" dy="0">3 灯に何を付け、</tspan><tspan x="392.0" dy="13.7">どのグループに割り当てるか</tspan></text>
<text x="654.0" y="311.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="654.0" dy="0">第 4 章、第 5 章</tspan></text>
<line x1="326.0" y1="332.0" x2="326.0" y2="346.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow1)"/>
<rect x="270.0" y="348.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="270.0" y="348.0" width="112.0" height="50.0" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.4"/>
<text x="326.0" y="377.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="326.0" dy="0">配置と出力</tspan></text>
<text x="392.0" y="369.2" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="392.0" dy="0">キー、フィル、背景の位置と</tspan><tspan x="392.0" dy="13.7">出力を段差で組む</tspan></text>
<text x="654.0" y="377.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="654.0" dy="0">第 6〜10 章</tspan></text>
<line x1="326.0" y1="398.0" x2="326.0" y2="412.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow1)"/>
<rect x="270.0" y="414.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="270.0" y="414.0" width="112.0" height="50.0" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.4"/>
<text x="326.0" y="443.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="326.0" dy="0">確認</tspan></text>
<text x="392.0" y="435.2" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="392.0" dy="0">ヒストグラム、ハイライト警告、</tspan><tspan x="392.0" dy="13.7">拡大表示で一灯ずつ確かめる</tspan></text>
<text x="654.0" y="443.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="654.0" dy="0">第 2、7、11 章</tspan></text>
<line x1="326.0" y1="464.0" x2="326.0" y2="478.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow1)"/>
<rect x="270.0" y="480.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<rect x="270.0" y="480.0" width="112.0" height="50.0" rx="6" fill="#f4f4f4" stroke="#333333" stroke-width="1.4"/>
<text x="326.0" y="509.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="326.0" dy="0">撤収と納品</tspan></text>
<text x="392.0" y="501.2" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="392.0" dy="0">熱を冷ましてから片付け、</tspan><tspan x="392.0" dy="13.7">バックアップし、現像して納める</tspan></text>
<text x="654.0" y="509.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="654.0" dy="0">第 11 章</tspan></text>
<path d="M270.0,109.0 C210.0,109.0 206.0,175.0 266.0,175.0" fill="none" stroke="#2f6db5" stroke-width="1.2" marker-end="url(#arrow2)"/>
<text x="200.0" y="142.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="end" fill="#2f6db5" font-weight="normal"><tspan x="200.0" dy="0">用途が絞りを決める</tspan><tspan x="200.0" dy="13.7">（顔だけか皿の奥までか）</tspan></text>
<path d="M270.0,175.0 C160.0,175.0 156.0,373.0 266.0,373.0" fill="none" stroke="#2f6db5" stroke-width="1.2" marker-end="url(#arrow2)"/>
<text x="150.0" y="274.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="end" fill="#2f6db5" font-weight="normal"><tspan x="150.0" dy="0">絞りが出力を決める</tspan><tspan x="150.0" dy="13.7">（f/8 で 1/4、f/16 で 1/2）</tspan></text>
<path d="M270.0,307.0 C210.0,307.0 206.0,373.0 266.0,373.0" fill="none" stroke="#2f6db5" stroke-width="1.2" marker-end="url(#arrow2)"/>
<text x="200.0" y="340.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10.5" text-anchor="end" fill="#2f6db5" font-weight="normal"><tspan x="200.0" dy="0">段差が配置を決める</tspan><tspan x="200.0" dy="13.7">（2 段下なら白レフ 1m）</tspan></text>
<text x="24.0" y="540.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">実際の作業は段階を行き来するが、依存の向きは変わらない</tspan></text>
</svg>

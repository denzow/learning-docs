<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="ヒストグラムで見るもの">
<defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<rect x="0.5" y="0.5" width="759" height="299" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="16" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="24.0" dy="0">ヒストグラムで見るもの</tspan></text>
<text x="24.0" y="52.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">左が黒、右が白。見るのは肌の山の位置と、左右の端に張り付いていないか</tspan></text>
<text x="140.0" y="84.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="140.0" dy="0">適正</tspan></text>
<rect x="30.0" y="94.0" width="220.0" height="130.0" rx="0" fill="#fbfaf7" stroke="#333333" stroke-width="1.2"/>
<path d="M30,224 L49.8,220.1 L80.6,208.4 L109.2,198.0 L140.0,179.8 L159.8,153.8 L175.2,139.5 L190.6,149.9 L206.0,179.8 L225.8,209.7 L250.0,221.4 L250,224 Z" fill="#a9b8cf" stroke="#333333" stroke-width="1" />
<text x="30.0" y="240.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="30.0" dy="0">黒</tspan></text>
<text x="250.0" y="240.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="end" fill="#7a7a7a" font-weight="normal"><tspan x="250.0" dy="0">白</tspan></text>
<text x="140.0" y="262.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="140.0" dy="0">右端にも左端にも山がない</tspan></text>
<line x1="182.0" y1="132.0" x2="182.0" y2="110.0" stroke="#b3541e" stroke-width="1"/>
<text x="182.0" y="106.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#b3541e" font-weight="normal"><tspan x="182.0" dy="0">肌の山（中央から右寄り）</tspan></text>
<text x="380.0" y="84.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="380.0" dy="0">明るすぎる（白飛び）</tspan></text>
<rect x="270.0" y="94.0" width="220.0" height="130.0" rx="0" fill="#fbfaf7" stroke="#333333" stroke-width="1.2"/>
<path d="M270,224 L309.6,221.4 L360.2,209.7 L399.8,186.3 L435.0,153.8 L459.2,139.5 L474.6,149.9 L481.2,169.4 L483.4,130.4 L490.0,100.5 L490,224 Z" fill="#a9b8cf" stroke="#333333" stroke-width="1" />
<text x="270.0" y="240.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="270.0" dy="0">黒</tspan></text>
<text x="490.0" y="240.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="end" fill="#7a7a7a" font-weight="normal"><tspan x="490.0" dy="0">白</tspan></text>
<text x="380.0" y="262.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="380.0" dy="0">肌が右端に届き、情報が失われている</tspan></text>
<rect x="483.0" y="100.0" width="7.0" height="124.0" rx="0" fill="#b3541e" stroke="none" stroke-width="0" opacity="0.8"/>
<line x1="486.0" y1="98.0" x2="470.0" y2="110.0" stroke="#b3541e" stroke-width="1"/>
<text x="466.0" y="110.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="end" fill="#b3541e" font-weight="normal"><tspan x="466.0" dy="0">右端に張り付く</tspan></text>
<text x="620.0" y="84.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" text-anchor="middle" fill="#333333" font-weight="bold"><tspan x="620.0" dy="0">背景を白く飛ばしたとき</tspan></text>
<rect x="510.0" y="94.0" width="220.0" height="130.0" rx="0" fill="#fbfaf7" stroke="#333333" stroke-width="1.2"/>
<path d="M510,224 L529.8,220.1 L560.6,205.8 L589.2,191.5 L615.6,169.4 L635.4,157.7 L650.8,165.5 L670.6,191.5 L694.8,213.6 L714.6,220.1 L721.2,220.1 L721.2,109.6 L730.0,100.5 L730,224 Z" fill="#a9b8cf" stroke="#333333" stroke-width="1" />
<text x="510.0" y="240.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="510.0" dy="0">黒</tspan></text>
<text x="730.0" y="240.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="end" fill="#7a7a7a" font-weight="normal"><tspan x="730.0" dy="0">白</tspan></text>
<text x="620.0" y="262.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="620.0" dy="0">右端の山は背景。人物の山だけを見る</tspan></text>
<rect x="721.0" y="100.0" width="9.0" height="124.0" rx="0" fill="#f2a900" stroke="none" stroke-width="0" opacity="0.9"/>
<line x1="638.0" y1="150.0" x2="638.0" y2="110.0" stroke="#b3541e" stroke-width="1"/>
<text x="638.0" y="106.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#b3541e" font-weight="normal"><tspan x="638.0" dy="0">人物の山</tspan></text>
<line x1="724.0" y1="104.0" x2="706.0" y2="126.0" stroke="#b3541e" stroke-width="1"/>
<text x="704.0" y="136.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="end" fill="#b3541e" font-weight="normal"><tspan x="704.0" dy="0">背景（意図した白）</tspan></text>
</svg>

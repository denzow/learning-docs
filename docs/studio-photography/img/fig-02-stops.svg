<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="絞り、シャッター速度、ISO、ストロボ出力の段の対応" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7a7a7a"/></marker>
</defs>
<rect x="0.5" y="0.5" width="759" height="399" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24" y="30" font-size="16" font-weight="bold" fill="#333333">段（stop）の物差し</text>
<text x="24" y="50" font-size="11" fill="#7a7a7a">隣り合う目盛りの差は、どの行でも光の量が 2 倍または半分（1 段）</text>

<!-- 基準の列の帯 -->
<rect x="315" y="104" width="90" height="236" fill="#f2a900" opacity="0.12" rx="4"/>
<text x="360" y="355" font-size="11" fill="#b3541e" text-anchor="middle">教材の基準（f/8、1/200 秒、ISO 100、出力 1/4）</text>

<!-- 明るい・暗い の矢印 -->
<line x1="180" y1="78" x2="720" y2="78" stroke="#7a7a7a" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="180" y="98" font-size="11" fill="#7a7a7a" text-anchor="start">← 明るい（光が多い）</text>
<text x="720" y="98" font-size="11" fill="#7a7a7a" text-anchor="end">暗い（光が少ない）→</text>

<!-- 段の数 -->
<g font-size="11" fill="#7a7a7a" text-anchor="middle">
  <text x="180" y="120">2 段明るい</text>
  <text x="270" y="120">1 段明るい</text>
  <text x="360" y="120">基準</text>
  <text x="450" y="120">1 段暗い</text>
  <text x="540" y="120">2 段暗い</text>
  <text x="630" y="120">3 段暗い</text>
</g>

<!-- 行 -->
<g stroke="#333333" stroke-width="1.2">
  <line x1="160" y1="160" x2="700" y2="160"/>
  <line x1="160" y1="215" x2="700" y2="215"/>
  <line x1="160" y1="270" x2="700" y2="270"/>
  <line x1="160" y1="325" x2="700" y2="325"/>
</g>
<g stroke="#333333" stroke-width="1.2">
  <g><line x1="180" y1="154" x2="180" y2="166"/><line x1="270" y1="154" x2="270" y2="166"/><line x1="360" y1="154" x2="360" y2="166"/><line x1="450" y1="154" x2="450" y2="166"/><line x1="540" y1="154" x2="540" y2="166"/><line x1="630" y1="154" x2="630" y2="166"/></g>
  <g><line x1="180" y1="209" x2="180" y2="221"/><line x1="270" y1="209" x2="270" y2="221"/><line x1="360" y1="209" x2="360" y2="221"/><line x1="450" y1="209" x2="450" y2="221"/><line x1="540" y1="209" x2="540" y2="221"/><line x1="630" y1="209" x2="630" y2="221"/></g>
  <g><line x1="180" y1="264" x2="180" y2="276"/><line x1="270" y1="264" x2="270" y2="276"/><line x1="360" y1="264" x2="360" y2="276"/></g>
  <g><line x1="180" y1="319" x2="180" y2="331"/><line x1="270" y1="319" x2="270" y2="331"/><line x1="360" y1="319" x2="360" y2="331"/><line x1="450" y1="319" x2="450" y2="331"/><line x1="540" y1="319" x2="540" y2="331"/></g>
</g>

<!-- 行の見出し -->
<g font-size="13" font-weight="bold" fill="#333333" text-anchor="end">
  <text x="140" y="150">絞り</text>
  <text x="140" y="205">シャッター速度</text>
  <text x="140" y="260">ISO</text>
  <text x="140" y="315">ストロボ出力</text>
</g>
<g font-size="11" fill="#7a7a7a" text-anchor="end">
  <text x="140" y="167">1.4 倍ずつ</text>
  <text x="140" y="222">2 倍ずつ</text>
  <text x="140" y="277">2 倍ずつ</text>
  <text x="140" y="332">2 倍ずつ</text>
</g>

<!-- 値 -->
<g font-size="13" fill="#333333" text-anchor="middle">
  <text x="180" y="148">f/4</text><text x="270" y="148">f/5.6</text><text x="360" y="148" font-weight="bold">f/8</text><text x="450" y="148">f/11</text><text x="540" y="148">f/16</text><text x="630" y="148">f/22</text>
  <text x="180" y="203">1/50</text><text x="270" y="203">1/100</text><text x="360" y="203" font-weight="bold">1/200</text><text x="450" y="203">1/400</text><text x="540" y="203">1/800</text><text x="630" y="203">1/1600</text>
  <text x="180" y="258">400</text><text x="270" y="258">200</text><text x="360" y="258" font-weight="bold">100</text>
  <text x="180" y="313">1/1</text><text x="270" y="313">1/2</text><text x="360" y="313" font-weight="bold">1/4</text><text x="450" y="313">1/8</text><text x="540" y="313">1/16</text>
</g>
<g font-size="10" fill="#7a7a7a" text-anchor="middle">
  <text x="450" y="258">（R10 にはない）</text>
  <text x="630" y="313">1/32（SK400II にはない）</text>
</g>
<text x="24" y="382" font-size="11" fill="#7a7a7a">例：絞りを f/8 から f/4 に 2 段開けたら、出力を 1/4 から 1/16 に 2 段落とせば同じ明るさになる。</text>
</svg>

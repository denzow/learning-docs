<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img" aria-label="反射の角度の族">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#333333"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7a7a7a"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6db5"/></marker></defs>
<rect x="0.5" y="0.5" width="779" height="439" rx="8" fill="#ffffff" stroke="#d9d9d9"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="16" text-anchor="start" fill="#333333" font-weight="bold"><tspan x="24.0" dy="0">反射の角度の族</tspan></text>
<text x="24.0" y="52.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="24.0" dy="0">カメラから面を見たとき、面が鏡だとして映る方向の範囲。そこに置いたものが面に映る</tspan></text>
<path d="M300,330 L485.7,70 L740,70 L740.0,205.1 L520,330 Z" fill="#2f6db5" opacity="0.12"/>
<text x="600.0" y="96.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="13" text-anchor="middle" fill="#2f6db5" font-weight="bold"><tspan x="600.0" dy="0">反射の角度の族</tspan></text>
<text x="600.0" y="114.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#2f6db5" font-weight="normal"><tspan x="600.0" dy="0">この範囲にある光源は</tspan><tspan x="600.0" dy="14.9">面にハイライトとして映る</tspan></text>
<rect x="300.0" y="330.0" width="220.0" height="12.0" rx="0" fill="#f4f4f4" stroke="#333333" stroke-width="1.4" />
<text x="410.0" y="366.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#333333" font-weight="normal"><tspan x="410.0" dy="0">光沢のある面（釉薬の陶器の表面）</tspan></text>
<g transform="translate(150,120) rotate(55)"><rect x="-16" y="-12" width="24" height="24" rx="3" fill="#3c3c3c"/><rect x="8" y="-8" width="14" height="16" fill="#666" stroke="#333333" stroke-width="1"/></g>
<text x="120.0" y="114.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="end" fill="#333333" font-weight="normal"><tspan x="120.0" dy="0">カメラ</tspan></text>
<line x1="150.0" y1="120.0" x2="300.0" y2="330.0" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="300.0" y1="330.0" x2="485.7" y2="70.0" stroke="#2f6db5" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="150.0" y1="120.0" x2="520.0" y2="330.0" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="520.0" y1="330.0" x2="740.0" y2="205.1" stroke="#2f6db5" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="360.0" y1="330.0" x2="360.0" y2="270.0" stroke="#7a7a7a" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="366.0" y="280.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="10" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="366.0" dy="0">法線</tspan></text>
<text x="292.0" y="284.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="end" fill="#7a7a7a" font-weight="normal"><tspan x="292.0" dy="0">入射角 = 反射角</tspan></text>
<g transform="translate(590,175) rotate(125)"><rect x="-6" y="-40" width="26" height="80" fill="#f7f7f7" stroke="#333333" stroke-width="1.4"/><rect x="18" y="-40" width="5" height="80" fill="#f2a900" stroke="#333333" stroke-width="1"/><circle cx="-14" cy="0" r="8" fill="#555555" stroke="#333333" stroke-width="1"/></g>
<circle cx="636.0" cy="145.0" r="10" fill="#333333"/>
<text x="636.0" y="149.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="636.0" dy="0">A</tspan></text>
<text x="652.0" y="149.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="652.0" dy="0">族の中：面に長方形の</tspan><tspan x="652.0" dy="14.9">ハイライトとして映る</tspan></text>
<g transform="translate(690,290) rotate(200)"><rect x="-6" y="-34" width="22" height="68" fill="#f7f7f7" stroke="#333333" stroke-width="1.4"/><rect x="14" y="-34" width="5" height="68" fill="#f2a900" stroke="#333333" stroke-width="1"/><circle cx="-14" cy="0" r="8" fill="#555555" stroke="#333333" stroke-width="1"/></g>
<circle cx="700.0" cy="340.0" r="10" fill="#333333"/>
<text x="700.0" y="344.5" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="700.0" dy="0">B</tspan></text>
<text x="684.0" y="364.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="end" fill="#333333" font-weight="normal"><tspan x="684.0" dy="0">族の外：面を明るくするが</tspan><tspan x="684.0" dy="14.9">像としては映らない</tspan></text>
<text x="410.0" y="400.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="middle" fill="#7a7a7a" font-weight="normal"><tspan x="410.0" dy="0">白い板を族の中に置けば白い縁、黒い板を置けば暗い縁が面に映る（ライトを動かさずに見え方を変えられる）</tspan></text>
</svg>

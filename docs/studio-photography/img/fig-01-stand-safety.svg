<line x1="352.0" y1="170.0" x2="320.0" y2="146.0" stroke="#333333" stroke-width="1"/>
<circle cx="320.0" cy="146.0" r="2.2" fill="#333333"/>
<circle cx="360.0" cy="176.0" r="10" fill="#333333"/>
<text x="360.0" y="180.3" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12.0" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="360.0" dy="0">5</tspan></text>
<circle cx="520.0" cy="86.0" r="10" fill="#333333"/>
<text x="520.0" y="90.3" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12.0" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="520.0" dy="0">1</tspan></text>
<text x="538.0" y="90.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="538.0" dy="0">脚を最大まで広げ、支柱を垂直に立てる</tspan></text>
<text x="538.0" y="107.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="538.0" dy="0">脚をすぼめたままだと重心が高く倒れやすい</tspan></text>
<circle cx="520.0" cy="144.0" r="10" fill="#333333"/>
<text x="520.0" y="148.3" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12.0" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="520.0" dy="0">2</tspan></text>
<text x="538.0" y="148.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="538.0" dy="0">サンドバッグはソフトボックス側の脚に</tspan></text>
<text x="538.0" y="165.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="538.0" dy="0">重い用具が張り出す側を押さえる</tspan></text>
<text x="538.0" y="180.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="538.0" dy="0">配置を変えるたびに載せ直す</tspan></text>
<circle cx="520.0" cy="217.0" r="10" fill="#333333"/>
<text x="520.0" y="221.3" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12.0" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="520.0" dy="0">3</tspan></text>
<text x="538.0" y="221.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="538.0" dy="0">ケーブルは支柱に沿わせて床へ下ろす</tspan></text>
<text x="538.0" y="238.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="538.0" dy="0">支柱に一巻きして遊びを作り、</tspan></text>
<text x="538.0" y="253.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="538.0" dy="0">人が通る床は養生テープで留める</tspan></text>
<circle cx="520.0" cy="290.0" r="10" fill="#333333"/>
<text x="520.0" y="294.3" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12.0" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="520.0" dy="0">4</tspan></text>
<text x="538.0" y="294.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="538.0" dy="0">モデリングランプ（150W）は熱くなる</tspan></text>
<text x="538.0" y="311.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="538.0" dy="0">撤収の前に切って冷ます。</tspan></text>
<text x="538.0" y="326.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="538.0" dy="0">用具を外すときは布を使う</tspan></text>
<circle cx="520.0" cy="363.0" r="10" fill="#333333"/>
<text x="520.0" y="367.3" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12.0" text-anchor="middle" fill="#fff" font-weight="bold"><tspan x="520.0" dy="0">5</tspan></text>
<text x="538.0" y="367.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="12" text-anchor="start" fill="#333333" font-weight="normal"><tspan x="538.0" dy="0">角度を決めたら締めネジを確実に締める</tspan></text>
<text x="538.0" y="384.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="538.0" dy="0">緩いとヘッドが下を向き、</tspan></text>
<text x="538.0" y="399.0" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="11" text-anchor="start" fill="#7a7a7a" font-weight="normal"><tspan x="538.0" dy="0">重心が動いて倒れる原因になる</tspan></text>
</svg>
